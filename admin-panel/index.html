<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>YHealth Admin</title>
  <style>
    :root {
      --bg: #0b1412; --surface: #12201d; --border: #1f3430; --text: #e8f1ef;
      --muted: #8aa39d; --accent: #2bd49a; --danger: #ef5b5b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
    h1 { font-size: 22px; margin: 0; }
    h1 span { color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; }
    .login { max-width: 380px; margin: 80px auto; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: #0e1a17; color: var(--text); font-size: 15px; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; font-size: 14px; }
    .primary { background: var(--accent); color: #062118; width: 100%; margin-top: 20px; }
    .ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat .n { font-size: 26px; font-weight: 700; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .toolbar input { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; }
    tr:last-child td { border-bottom: 0; }
    .empty { text-align: center; color: var(--muted); padding: 28px 0; }
    .hidden { display: none !important; }
    .who { font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="login" class="card login hidden">
      <h1>YHealth <span>Admin</span></h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Şifrə</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Daxil ol</button>
        <div id="login-error" class="error"></div>
      </form>
    </section>

    <section id="dashboard" class="hidden">
      <header>
        <h1>YHealth <span>Admin</span></h1>
        <div>
          <span id="who" class="who"></span>
          <button id="logout" class="ghost">Çıxış</button>
        </div>
      </header>

      <div class="stats">
        <div class="card stat"><div class="n" id="stat-total">0</div><div class="l">İstifadəçi</div></div>
        <div class="card stat"><div class="n" id="stat-age">–</div><div class="l">Orta yaş</div></div>
        <div class="card stat"><div class="n" id="stat-week">0</div><div class="l">Son 7 gündə qoşulan</div></div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Ad ilə axtar...">
        <button id="export" class="ghost">CSV yüklə</button>
      </div>

      <div class="card" style="padding: 6px 12px;">
        <table>
          <thead>
            <tr>
              <th data-sort="fullName">Ad Soyad</th>
              <th data-sort="age">Yaş</th>
              <th data-sort="language">Dil</th>
              <th data-sort="createdAt">Qoşulub</th>
              <th data-sort="updatedAt">Son yenilənmə</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="empty hidden">Hələ istifadəçi yoxdur.</div>
        <div id="load-error" class="error" style="padding: 0 10px 12px;"></div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { firebaseConfig } from './config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    let users = [];
    let sortKey = 'createdAt';
    let sortDir = -1;
    let unsubscribe = null;

    const fmtDate = (ts) => ts ? ts.toDate().toLocaleString('az-AZ', { dateStyle: 'medium', timeStyle: 'short' }) : '–';
    const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function render() {
      const q = $('search').value.trim().toLowerCase();
      const list = users
        .filter((u) => !q || (u.fullName || '').toLowerCase().includes(q))
        .sort((a, b) => {
          const va = a[sortKey]?.toMillis ? a[sortKey].toMillis() : a[sortKey] ?? '';
          const vb = b[sortKey]?.toMillis ? b[sortKey].toMillis() : b[sortKey] ?? '';
          return va > vb ? sortDir : va < vb ? -sortDir : 0;
        });

      $('rows').innerHTML = list.map((u) => `
        <tr>
          <td>${escapeHtml(u.fullName)}</td>
          <td>${escapeHtml(u.age)}</td>
          <td>${escapeHtml((u.language || '').toUpperCase())}</td>
          <td>${fmtDate(u.createdAt)}</td>
          <td>${fmtDate(u.updatedAt)}</td>
        </tr>`).join('');
      $('empty').classList.toggle('hidden', list.length > 0);

      $('stat-total').textContent = users.length;
      const ages = users.map((u) => u.age).filter((a) => typeof a === 'number');
      $('stat-age').textContent = ages.length ? Math.round(ages.reduce((s, a) => s + a, 0) / ages.length) : '–';
      const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
      $('stat-week').textContent = users.filter((u) => u.createdAt && u.createdAt.toMillis() >= weekAgo).length;
    }

    function exportCsv() {
      const header = ['Ad Soyad', 'Yaş', 'Dil', 'Qoşulub', 'Son yenilənmə'];
      const rows = users.map((u) => [u.fullName, u.age, u.language, fmtDate(u.createdAt), fmtDate(u.updatedAt)]);
      const csv = [header, ...rows]
        .map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\r\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `yhealth-users-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    onAuthStateChanged(auth, (user) => {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      $('login').classList.toggle('hidden', !!user);
      $('dashboard').classList.toggle('hidden', !user);
      if (!user) return;
      $('who').textContent = user.email || '';
      $('load-error').textContent = '';
      unsubscribe = onSnapshot(
        collection(db, 'users'),
        (snap) => { users = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); },
        (err) => { $('load-error').textContent = err.code === 'permission-denied' ? 'Bu hesabın admin icazəsi yoxdur.' : err.message; }
      );
    });

    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('login-error').textContent = '';
      try {
        await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value);
      } catch (err) {
        $('login-error').textContent = 'Email və ya şifrə yanlışdır.';
      }
    });
    $('logout').addEventListener('click', () => signOut(auth));
    $('search').addEventListener('input', render);
    $('export').addEventListener('click', exportCsv);
    document.querySelectorAll('th[data-sort]').forEach((th) => th.addEventListener('click', () => {
      const key = th.dataset.sort;
      sortDir = sortKey === key ? -sortDir : 1;
      sortKey = key;
      render();
    }));
  </script>
</body>
</html>
