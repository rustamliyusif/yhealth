name: yhealth
description: "A modern, minimalist Android health and fitness tracking application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  fl_chart: ^0.69.0
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.6
  pdf: ^3.13.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/fonts/
